[project]
name = "cogsb"
version = "0.1.0"
description = "Center of Gravity / Base of Support / Center of Pressure visualization pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "mediapipe",
  "scipy",
  "pydantic",
  "shapely",
  "pydantic-settings",
  "typer>=0.12",
  "rich>=13.9"
]

[project.optional-dependencies]
analysis = [
  "cvxpy>=1.5",
  "smplx>=0.1.28; python_version>='3.10'"
]

[project.scripts]
cogsb = "cogsb.cli:main"
cogsb-start = "cogsb.cli.start:main"
cogsb-gui = "cogsb.gui:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
